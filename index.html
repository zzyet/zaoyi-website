    <style>
      /* Side Go code streams — colors match site accent / teal */
      .code-stream {
        position: fixed;
        z-index: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 148px;
        height: 58vh;
        overflow: hidden;
        pointer-events: none;
        font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        line-height: 1.55;
        white-space: pre;
        color: rgba(124, 92, 255, 0.62);
        mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
        opacity: 1;
        transition: opacity 0.35s ease;
      }
      .code-stream.left {
        left: clamp(12px, 2vw, 36px);
        text-align: left;
        opacity: 0.9;
      }
      .code-stream.right {
        right: clamp(16px, 3vw, 48px);
        text-align: right;
        color: rgba(6, 182, 212, 0.58);
        opacity: 0.78;
      }
      html[data-theme="dark"] .code-stream { color: rgba(167, 139, 250, 0.58); }
      html[data-theme="dark"] .code-stream.left { opacity: 0.88; }
      html[data-theme="dark"] .code-stream.right { color: rgba(34, 211, 238, 0.55); opacity: 0.8; }
      .code-stream span {
        display: block;
        animation: codeScroll 22s linear infinite;
      }
      .code-stream.right span {
        animation-duration: 28s;
        animation-direction: reverse;
      }
      @keyframes codeScroll {
        from { transform: translateY(0); }
        to { transform: translateY(-50%); }
      }
      @media (max-width: 1100px) {
        .code-stream.left { display: none; }
      }
      @media (max-width: 960px) {
        .code-stream { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .code-stream span { animation: none; }
        .code-stream { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="code-stream left" aria-hidden="true"><span id="code-left"></span></div>
    <div class="code-stream right" aria-hidden="true"><span id="code-right"></span></div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function initGoCodeStreams() {
        var lines = [
          'package main',
          '',
          'import (',
          '  "context"',
          '  "fmt"',
          '  "net/http"',
          ')',
          '',
          'func Deploy(ctx context.Context) error {',
          '  pipeline := NewAIPipeline()',
          '  if err := pipeline.Analyze(); err != nil {',
          '    return fmt.Errorf("analyze: %w", err)',
          '  }',
          '  return pipeline.Ship(ctx)',
          '}',
          '',
          'type Agent struct {',
          '  Model  string',
          '  Tokens int',
          '}',
          '',
          'func (a *Agent) Generate(prompt string) string {',
          '  return a.infer(prompt)',
          '}',
          '',
          'go func() {',
          '  mux.HandleFunc("/api/v1/ship", handler)',
          '  http.ListenAndServe(":8080", mux)',
          '}()',
          '',
          'ch := make(chan Result, 8)',
          'defer close(ch)',
          '',
          'select {',
          'case r := <-ch:',
          '  log.Printf("ok: %v", r)',
          'case <-ctx.Done():',
          '  return ctx.Err()',
          '}',
          '',
          'var wg sync.WaitGroup',
          'wg.Add(1)',
          'go worker(ctx, &wg)',
          'wg.Wait()',
        ];
        var block = lines.join('\n');
        var text = block + '\n' + block + '\n' + block + '\n' + block;
        var left = document.getElementById('code-left');
        var right = document.getElementById('code-right');
        if (left) left.textContent = text;
        if (right) right.textContent = text;

        var streams = document.querySelectorAll('.code-stream');
        function syncOpacity() {
          var fade = Math.max(0, 1 - window.scrollY / 420);
          streams.forEach(function (el) {
            var base = el.classList.contains('left') ? 0.9 : 0.78;
            el.style.opacity = String(fade * base);
          });
        }
        window.addEventListener('scroll', syncOpacity, { passive: true });
        syncOpacity();
      })();
    </script>
  </body>
